# Backend only (Docker). Build context is backend/. Without Ollama or a Groq key the
# deployed service runs rule-based analysis only; vector data on the free plan is ephemeral.
services:
  - type: web
    name: legal-document-analyzer-api
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false   # e.g. https://your-frontend.example.com
      - key: GROQ_API_KEY
        sync: false   # optional
      - key: QDRANT_URL
        sync: false   # optional (falls back to local on-disk Qdrant)
      - key: QDRANT_API_KEY
        sync: false   # optional
